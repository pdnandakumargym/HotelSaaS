# Example production reverse proxy (nginx) for StaySync.
# - Terminates TLS, serves the Angular build, proxies /api to the Node API.
# - Overwrites X-Forwarded-For with the real peer address so clients cannot spoof it.
#   With this config set TRUST_PROXY=1 on the API (exactly one trusted hop).
# Replace app.example.com and certificate paths before use.

upstream staysync_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/ssl/staysync/fullchain.pem;
    ssl_certificate_key /etc/ssl/staysync/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 12m;   # photo uploads (API limits each to PHOTO_MAX_UPLOAD_MB)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /var/www/staysync/browser;   # contents of apps/web/dist/web/browser
    index index.html;

    location /api/ {
        proxy_pass http://staysync_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Hashed static assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
